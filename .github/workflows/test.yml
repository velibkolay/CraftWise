name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Headless tests and Forever API audit
        run: lua5.1 tests/run.lua
  companion:
    # Companion app (#93, #94): SavedVariables parser, market entry port (golden-tested against
    # fixtures written by the Lua code, tests/companion_fixtures.lua), typed readers, upload app.
    # The app is cross-compiled for Windows and macOS (no cgo); nothing is published here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Cross-compile windows/amd64 and darwin/arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-H=windowsgui" -o /tmp/craftwise-companion.exe ./cmd/craftwise-companion
          GOOS=darwin GOARCH=arm64 go build -o /tmp/craftwise-companion-macos ./cmd/craftwise-companion
  web:
    # wow.velikopter.com Worker (#95): typecheck and vitest in the Workers runtime (Miniflare).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
